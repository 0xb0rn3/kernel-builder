name: Rust validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: stable
      - name: Validate installer and packaging scripts
        run: |
          bash -n install.sh
          bash -n tools/package-release.sh
          bash install.sh --help
      - name: Compile
        run: cargo check --locked
      - name: Run unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
