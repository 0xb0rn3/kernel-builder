name: Build and publish release assets

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Serialize release attempts so two runs cannot race to create the same version release.
concurrency:
  group: kernel-builder-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Select release tag and refuse overwrites
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          expected="v${version}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            actual="$GITHUB_REF_NAME"
          else
            actual="$expected"
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "Refusing release: requested tag $actual does not match Cargo.toml version $expected" >&2
            exit 1
          fi
          echo "tag_name=$actual" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$actual" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "$actual" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $actual already exists; skipping to preserve its assets."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $actual from commit $GITHUB_SHA."
          fi

      - name: Synchronize notes for an existing current-version release
        if: steps.release_guard.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release_guard.outputs.tag_name }}"
          echo "Updating notes for existing $tag; its release assets will not be modified."
          gh release edit "$tag" --title "akt $tag" --notes-file RELEASE_NOTES.md

      - name: Run unit tests
        if: steps.release_guard.outputs.publish == 'true'
        run: cargo test --locked

      - name: Build glibc binary (Ubuntu 22.04 baseline)
        if: steps.release_guard.outputs.publish == 'true'
        run: cargo build --release --locked

      - name: Build static musl binary
        if: steps.release_guard.outputs.publish == 'true'
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package bundles and verify checksums
        if: steps.release_guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kernel-builder-release"
          bash tools/package-release.sh "$out"
          (cd "$out" && sha256sum --check SHA256SUMS)
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Publish GitHub release
        if: steps.release_guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_guard.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "akt ${{ steps.release_guard.outputs.tag_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/kernel-builder-release/akt-x86_64-linux
            ${{ runner.temp }}/kernel-builder-release/akt-x86_64-linux-musl
            ${{ runner.temp }}/kernel-builder-release/kernel-builder-v${{ steps.release_guard.outputs.release_version }}-x86_64-linux.tar.gz
            ${{ runner.temp }}/kernel-builder-release/kernel-builder-v${{ steps.release_guard.outputs.release_version }}-x86_64-linux-musl.tar.gz
            ${{ runner.temp }}/kernel-builder-release/SHA256SUMS
