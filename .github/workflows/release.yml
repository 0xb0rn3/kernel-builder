name: Build and publish release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and publish
    # Older glibc baseline improves compatibility; static musl and distro packages are also attached.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install release packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools zstd dpkg-dev

      - name: Derive release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify release tag matches package version and is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="v$(sed -n 's/^version = "\\([^"]*\\)".*/\\1/p' Cargo.toml | head -n1)"
          actual="${GITHUB_REF_NAME}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Refusing release: tag $actual does not match Cargo.toml version $expected" >&2
            exit 1
          fi
          if gh release view "$actual" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $actual; increment the version and tag a new release." >&2
            exit 1
          fi

      - name: Run unit tests
        run: cargo test --locked

      - name: Build glibc binary
        run: cargo build --release --locked

      - name: Build static musl binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package portable bundles and native distro packages
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kernel-builder-release"
          bash tools/package-release.sh "$out"
          (cd "$out" && sha256sum --check SHA256SUMS)
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "akt v${{ env.RELEASE_VERSION }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/kernel-builder-release/akt-x86_64-linux
            ${{ runner.temp }}/kernel-builder-release/akt-x86_64-linux-musl
            ${{ runner.temp }}/kernel-builder-release/kernel-builder-v${{ env.RELEASE_VERSION }}-x86_64-linux.tar.gz
            ${{ runner.temp }}/kernel-builder-release/kernel-builder-v${{ env.RELEASE_VERSION }}-x86_64-linux-musl.tar.gz
            ${{ runner.temp }}/kernel-builder-release/kernel-builder_${{ env.RELEASE_VERSION }}_amd64.deb
            ${{ runner.temp }}/kernel-builder-release/kernel-builder-${{ env.RELEASE_VERSION }}-1-x86_64.pkg.tar.zst
            ${{ runner.temp }}/kernel-builder-release/SHA256SUMS
