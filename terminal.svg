<title id="t">akt dry-run session</title>
<desc id="d">An animated terminal session: akt detect, then a dry-run build plan with the calculated build resources.</desc>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace;font-size:14px}.cmd{fill:#f2f4f8}.out{fill:rgba(255,255,255,.66)}.head{fill:#f2f4f8;font-weight:700}.res{fill:#4ec37a}.pr{fill:#e8702a;font-weight:700}@media (prefers-reduced-motion:no-preference){@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes t0{0%{clip-path:inset(0 100% 0 0);opacity:1}3.125%{clip-path:inset(0 100% 0 0);opacity:1;animation-timing-function:steps(10,end)}8.125%,85%{clip-path:inset(0 0 0 0);opacity:1;animation-timing-function:linear}91.25%,100%{clip-path:inset(0 0 0 0);opacity:0}}@keyframes q0{0%,3.125%{opacity:0}3.425%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o1{0%,10%{opacity:0}10.4%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o2{0%,11.25%{opacity:0}11.65%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes t3{0%{clip-path:inset(0 100% 0 0);opacity:1}17.5%{clip-path:inset(0 100% 0 0);opacity:1;animation-timing-function:steps(49,end)}30%,85%{clip-path:inset(0 0 0 0);opacity:1;animation-timing-function:linear}91.25%,100%{clip-path:inset(0 0 0 0);opacity:0}}@keyframes q3{0%,17.5%{opacity:0}17.8%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o4{0%,31.875%{opacity:0}32.275%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o5{0%,33.125%{opacity:0}33.525%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o6{0%,34.375%{opacity:0}34.775%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o7{0%,35.625%{opacity:0}36.025%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o8{0%,36.875%{opacity:0}37.275%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o9{0%,41.875%{opacity:0}42.275%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o10{0%,46.25%{opacity:0}46.65%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes o11{0%,46.875%{opacity:0}47.275%,85%{opacity:1}91.25%,100%{opacity:0}}@keyframes pp{0%,50%{opacity:0}50.4%,85%{opacity:1}91.25%,100%{opacity:0}}.cursor{animation:blink 1.1s steps(1) infinite}.c0{animation:t0 16.0s infinite}.q0{animation:q0 16.0s infinite}.o1{animation:o1 16.0s infinite}.o2{animation:o2 16.0s infinite}.c3{animation:t3 16.0s infinite}.q3{animation:q3 16.0s infinite}.o4{animation:o4 16.0s infinite}.o5{animation:o5 16.0s infinite}.o6{animation:o6 16.0s infinite}.o7{animation:o7 16.0s infinite}.o8{animation:o8 16.0s infinite}.o9{animation:o9 16.0s infinite}.o10{animation:o10 16.0s infinite}.o11{animation:o11 16.0s infinite}.pp{animation:pp 16.0s infinite}}</style>
<rect width="960" height="418" rx="16" fill="#0d0e12"/>
<rect x=".5" y=".5" width="959" height="417" rx="16" fill="none" stroke="rgba(255,255,255,.12)"/>
<text x="32" y="38" style="fill:rgba(255,255,255,.38);font-size:13px">akt on an Arch-family host (illustrative session, tune line omitted for width)</text>
<path d="M0 54H960" stroke="rgba(255,255,255,.12)"/>
<text class="pr q0" x="32" y="76">$</text><text class="cmd c0" x="54" y="76">akt detect</text><text class="out o1" x="32" y="98">host distro : arch</text><text class="out o2" x="32" y="120">build path  : Arch — fork CachyOS + overlay ARXOS config/patches -&gt; pacman package</text><text class="pr q3" x="32" y="142">$</text><text class="cmd c3" x="54" y="142">akt build --dry-run --max-jobs 4 --thinlto-jobs 2</text><text class="head o4" x="32" y="164">== akt build: arch / flavor default ==</text><text class="out o5" x="32" y="186">  base    : CachyOS linux-cachyos (rolling latest)</text><text class="out o6" x="32" y="208">  overlay : /usr/share/kernel-builder/config/arxos.fragment</text><text class="out o7" x="32" y="230">  patches : /usr/share/kernel-builder/patches/arxos</text><text class="out o8" x="32" y="252">  output  : pacman package  linux-arxos rev 1  (+ headers)</text><text class="res o9" x="32" y="296">resources: CPUs=16 available=27011MiB reserve=4096MiB disk=664GiB make=-j4 ThinLTO=2</text><text class="out o10" x="32" y="318">[dry-run] no build performed. Resource estimates use actual disk capacity, but the 60 GiB</text><text class="out o11" x="32" y="340">full-build threshold is not enforced for a plan-only run.</text><text class="pr pp" x="32" y="362">$</text><g class="pp"><rect class="cursor" x="54" y="349" width="9" height="17" fill="#e8702a"/></g>
</svg>
